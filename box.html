<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch the Square</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #222; color: #fff; }
    #game-box { width: 400px; height: 400px; border: 2px solid #fff; margin: 20px auto; position: relative; background: #111; }
    #target { width: 50px; height: 50px; background: #ff4757; position: absolute; cursor: pointer; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Catch the Square!</h1>
  <p>Score: <span id="score">0</span></p>
  <div id="game-box">
    <div id="target"></div>
  </div>

  <script>
    let score = 0;
    const target = document.getElementById('target');
    const scoreDisplay = document.getElementById('score');

    function moveTarget() {
      const x = Math.floor(Math.random() * 350);
      const y = Math.floor(Math.random() * 350);
      target.style.left = x + 'px';
      target.style.top = y + 'px';
    }

    target.addEventListener('click', () => {
      score++;
      scoreDisplay.textContent = score;
      moveTarget();
    });

    moveTarget();
  </script>
</body>
</html>
